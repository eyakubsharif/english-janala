<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
<!-- daisyui cdn -->
     <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- font  awesome cdn -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- style.css file added -->
     <link rel="stylesheet" href="styles/style.css">

</head>
<body>
     <!-- Banner section start here -->
     <section id="banner" class="flex justify-center items-center py-20">
        <div class="flex items-center justify-between w-11/12 mx-auto">
            <div class="w-[50%]">
                <h1 class="font-bold text-xl"><span class="text-blue-500">English</span> is Easy !!</h1>
                <p class="py-2">আজ থেকেই আপনার ভাষা শেখার যাত্রা শুরু করুন। আপনি যদি নতুন হন অথবা আপনার দক্ষতা বাড়াতে চান, আমাদের Interactive Lessons আপনাকে নিয়ে যাবে অন্য একটি Level এ</p>
                <form class="space-y-2" >
                   <input id="name" class="input" type="text" placeholder="Enter Your Name"><br>
                   <input id="password" class="input" type="password" placeholder="Password 123"><br>
                   <input id="login" class="btn btn-primary" type="button" value="Get Started">
                </form>
            </div>
            <div class="w-[50%]">
                <img class="w-120 mx-auto" src="assets/hero-student.png" alt="">
            </div>
        </div>
     </section>



     <script src="scripts/login.js"></script>
</body>
</html>
